name: Build SurveyQuant v1.0.40

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SurveyQuant v1.0.40
        run: |
          unzip -o SurveyQuantAndroid_v1.0.40_API21_COMPILE35.zip
          cp -r SurveyQuantAndroid/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.40-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
