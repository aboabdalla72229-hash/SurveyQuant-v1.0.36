name: Build Survey Technical Office

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Latest Survey Technical Office
        run: |
          unzip -o SurveyTechnicalOffice_RV42_V33_FULL_GitHubReady.zip

          if [ -d "SurveyTechnicalOffice" ]; then
            cp -r SurveyTechnicalOffice/. .
          elif [ -d "SurveyQuantAndroid" ]; then
            cp -r SurveyQuantAndroid/. .
          else
            echo "ERROR: Android project folder was not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Survey Technical Office APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Survey Technical Office APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyTechnicalOffice-Latest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
